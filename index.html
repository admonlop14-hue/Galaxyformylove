<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Galaxia Interactiva</title>
  <style>
    /* Estilos CSS - Sin cambios */
    html,body{margin:0;height:100%;background:#000;overflow:hidden}
    #galaxy-canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
    .hud{position:fixed;left:10px;right:10px;bottom:10px;display:flex;gap:8px;align-items:center;
         background:rgba(20,15,35,.25);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:8px;
         backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial}
    .hud button{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#fff}
    .hud input[type=file]{display:none}
    .pill{position:fixed;top:10px;left:50%;transform:translateX(-50%);padding:6px 12px;border-radius:999px;
          background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;font:12px system-ui}
    .error{position:fixed;inset:auto 10px 70px 10px;background:#260015;color:#ffd9f7;border:1px solid #ff8ae5;border-radius:10px;padding:10px;font:12px system-ui;display:none}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<canvas id="galaxy-canvas"></canvas>
<div class="pill">Arrastra • Pinch/rueda </div>
<div id="err" class="error"></div>

<div class="hud">
  <button id="playBtn">▶︎</button>
  <span style="font-size:12px;opacity:.9">Te quiero a morir</span>
  <input type="file" id="pickFile" accept="audio/*">
  <button id="pickBtn">Te la dedico</button>
  <audio id="audio" preload="none"><source id="songSrc" src="ahi_estabas_tu.mp3" type="audio/mpeg"></audio>
</div>

<canvas id="fx" style="position:fixed;inset:0;pointer-events:none;"></canvas>

<script>
const CONFIG = {
  songFile: 'Te quiero a morir.mp3',
  phrases: [
    'Mamacita','Mi amor ❤️','Guapa 😍','Mi cielo 🌌','Eres mi todo ✨',
    'Siempre tú ♾️','Gracias por estar 🙏','Te quiero mucho 🥰','Me encantas 💫','Darling',
    'Amo tu voz 🎶','me fascina tu sonrisa 😊','Reinota 👑','Ardillita','Me obsesionas',
    ,'Mi vida 💖','Hola preciosa ✨','¿Por qué tan linda? 🤭','Te extraño 🫶',
    'Te pienso 💭','Amo tus ojitos 👀','Contigo 💑','Quiero que seas tú 💖','Juntos siempre','Princesa',
    'La niña de mis ojos','Mi mundo entero','Mi futura esposa','Mi todo'
  ],
  theme: 'pink',   // violet | pink | red
  shape: 'oval',   // round | oval
  effect: 'sparks' // hearts | sparks
};

// ==== AUDIO - Sin cambios ====
const audio = document.getElementById('audio');
const songSrc = document.getElementById('songSrc');
songSrc.src = CONFIG.songFile;
const playBtn = document.getElementById('playBtn');
const pickBtn = document.getElementById('pickBtn');
const pickFile = document.getElementById('pickFile');
playBtn.onclick = async () => {
  try { if (audio.paused) { await audio.play(); playBtn.textContent='⏸︎'; } else { audio.pause(); playBtn.textContent='▶︎'; } }
  catch(e){ alert('Si no suena, toca “Elegir canción” y selecciona tu MP3.'); }
};
pickBtn.onclick = () => pickFile.click();
pickFile.onchange = () => {
  if (pickFile.files && pickFile.files[0]) {
    const url = URL.createObjectURL(pickFile.files[0]);
    audio.src = url; audio.play().then(()=> playBtn.textContent='⏸︎').catch(()=>{});
  }
};

// ==== WEBGL ====
const canvas = document.getElementById('galaxy-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.set(0,26,110);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Fondo estrellas
function makeStarTexture(size=1024, count=6000) {
  const c = document.createElement('canvas'); c.width=c.height=size;
  const g = c.getContext('2d');
  g.fillStyle = '#050002'; g.fillRect(0,0,size,size);
  for (let i=0;i<count;i++) {
    const x = Math.random()*size, y = Math.random()*size;
    const r = Math.random();
    let color;
    if (r < 0.7) {
        color = 'rgba(255,255,255,'+(Math.random()*0.6 + 0.2)+')';
    } else if (r < 0.9) {
        color = 'rgba(255,150,150,'+(Math.random()*0.7 + 0.3)+')';
    } else {
        color = 'rgba(255,220,180,'+(Math.random()*0.5 + 0.3)+')';
    }
    g.fillStyle = color;
    g.fillRect(x,y,1,1);
  }
  return new THREE.CanvasTexture(c);
}
scene.add(new THREE.Mesh(new THREE.SphereGeometry(600,64,64),
  new THREE.MeshBasicMaterial({ map: makeStarTexture(), side: THREE.BackSide })));

// Frases - Sin cambios
const galaxy = new THREE.Group(); scene.add(galaxy);
for (let i=0;i<CONFIG.phrases.length*6;i++){
  const text = CONFIG.phrases[i%CONFIG.phrases.length];
  const c=document.createElement('canvas');c.width=512;c.height=64;
  const g=c.getContext('2d');g.font='bold 32px Arial';g.fillStyle='#fff';g.textAlign='center';g.fillText(text,256,32);
  const tex=new THREE.CanvasTexture(c);
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true }));
  const angle=i/50*Math.PI*2; const dist=50+Math.random()*40;
  spr.position.set(Math.cos(angle)*dist,(Math.random()-0.5)*20,Math.sin(angle)*dist);
  spr.scale.set(15,3,1);
  galaxy.add(spr);
}

// === Centro Galáctico y Nebulosa ===

// 1. Halo/Nebulosa Central (Capa de Gas/Polvo)
function makeNebulaTexture(size=1024) {
    const c = document.createElement('canvas'); c.width=c.height=size;
    const g = c.getContext('2d');
    const gradient = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    // Colores de nebulosa con centro más brillante y blanco/rosado
    gradient.addColorStop(0, 'rgba(255, 180, 200, 0.9)'); // Blanco-rosado muy brillante en el centro
    gradient.addColorStop(0.2, 'rgba(255, 80, 140, 0.7)'); // Rosa más profundo
    gradient.addColorStop(0.5, 'rgba(200, 40, 80, 0.5)'); // Rojo-rosa
    gradient.addColorStop(0.8, 'rgba(100, 10, 30, 0.2)'); // Rojo muy tenue
    gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
    g.fillStyle = gradient;
    g.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(c);
}
const nebulaTexture = makeNebulaTexture();
const halo=new THREE.Mesh(new THREE.PlaneGeometry(500,500), 
    new THREE.MeshBasicMaterial({
        map: nebulaTexture,
        transparent:true,
        opacity:0.9,
        side:THREE.DoubleSide,
        blending: THREE.AdditiveBlending
    }));
halo.rotation.x=-Math.PI/2; 
scene.add(halo);

// 2. Punto de Luz Intenso (Núcleo Brillante) - Reemplaza el 'core' negro
// Se crea una textura de foco de luz para el punto central
function createLightFlareTexture(size = 64) {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    const context = canvas.getContext('2d');
    const gradient = context.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    // Foco de luz muy brillante, casi blanco en el centro
    gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
    gradient.addColorStop(0.5, 'rgba(255, 180, 200, 0.8)'); // Rosa pálido
    gradient.addColorStop(1, 'rgba(255, 0, 0, 0)');
    context.fillStyle = gradient;
    context.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(canvas);
}
const lightFlareTexture = createLightFlareTexture();
const lightFlare = new THREE.Sprite(new THREE.SpriteMaterial({
    map: lightFlareTexture,
    color: 0xffffff, // Color blanco para dejar que la textura defina el tono
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
}));
lightFlare.scale.set(30, 30, 1); // Tamaño del punto de luz central
scene.add(lightFlare);

// 3. Sistema de partículas de polvo estelar - Sin cambios, ya que funciona bien
function createSoftParticleTexture(size = 64) {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    const context = canvas.getContext('2d');
    const gradient = context.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    gradient.addColorStop(0, 'rgba(255,255,255,1)');
    gradient.addColorStop(0.2, 'rgba(255,255,255,0.7)');
    gradient.addColorStop(1, 'rgba(255,255,255,0)');
    context.fillStyle = gradient;
    context.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(canvas);
}
const softParticleTexture = createSoftParticleTexture();

const dustParticles = new THREE.Group();
scene.add(dustParticles);

const numDustParticles = 3000;

for (let i = 0; i < numDustParticles; i++) {
    const material = new THREE.SpriteMaterial({
        map: softParticleTexture,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

    const sprite = new THREE.Sprite(material);

    const angle = Math.random() * Math.PI * 2;
    const radius = Math.random() * Math.random() * 150 + 20;
    sprite.position.x = Math.cos(angle) * radius;
    sprite.position.y = (Math.random() - 0.5) * 60;
    sprite.position.z = Math.sin(angle) * radius;

    const c = new THREE.Color().lerpColors(new THREE.Color(0xff88ff), new THREE.Color(0xff4444), Math.random());
    sprite.material.color = c;

    const size = Math.random() * 8 + 3;
    sprite.scale.set(size, size, 1);

    sprite.material.opacity = Math.random() * 0.6 + 0.3;

    dustParticles.add(sprite);
}


// Animación - Sin cambios (solo añadimos la rotación de las partículas)
function animate(){
  requestAnimationFrame(animate);
  galaxy.rotation.y += 0.0015;
  dustParticles.rotation.y += 0.0005;
  controls.update();
  renderer.render(scene,camera);
}
animate();

// Doble toque efecto - Sin cambios
const fx=document.getElementById('fx'); const ctx2=fx.getContext('2d');
function resizeFx(){fx.width=innerWidth*2;fx.height=innerHeight*2;fx.style.width=innerWidth+'px';fx.height=innerHeight+'px';}
resizeFx();addEventListener('resize',resizeFx);
const sparks=[];
function spawn(x,y){for(let i=0;i<20;i++)sparks.push({x:x*2,y:y*2,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,life:1});}
let lastTap=0;
addEventListener('click',e=>{if(performance.now()-lastTap<300)spawn(e.clientX,e.clientY);lastTap=performance.now();});
addEventListener('touchend',e=>{const t=e.changedTouches[0];if(performance.now()-lastTap<300)spawn(t.clientX,t.clientY);lastTap=performance.now();});
function loopFx(){ctx2.clearRect(0,0,fx.width,fx.height);for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.life-=0.02;ctx2.fillStyle='rgba(255,220,180,'+s.life+')';ctx2.beginPath();ctx2.arc(s.x,s.y,3,0,Math.PI*2);ctx2.fill();if(s.life<=0)sparks.splice(i,1);}requestAnimationFrame(loopFx);}loopFx();
</script>
</body>
</html>
